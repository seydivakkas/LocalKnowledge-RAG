name: LocalKnowledge engineering preview — no commercial release
on:
  push:
    branches: [main, 'feature/**', 'g09/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install regression dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install packaging==25.0
      - name: Source and regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: G10 mixed-document Linux queue smoke (engineering only)
        run: python benchmarks/g10_queue_soak.py --count 6 --output evidence/g10_linux_queue_soak.json
  windows-engineering:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install runtime/test/build dependencies
        run: |
          python -m pip install -e ".[test]"
          python -m pip install pyinstaller==6.22.3 packaging==25.0
      - name: Resolve exact installed runtime dependency closure
        run: python packaging/wheel_evidence.py plan pyproject.toml evidence/runtime_wheel_pins.txt
      - name: Download exact Windows wheel candidates and lock their SHA-256
        run: |
          python -m pip download --only-binary=:all: --no-deps --dest "${{ runner.temp }}/lk-runtime-wheels" -r evidence/runtime_wheel_pins.txt
          python packaging/wheelhouse_stage.py lock "${{ runner.temp }}/lk-runtime-wheels" evidence/runtime_wheel_pins.txt evidence/runtime_wheel_hashes.txt
      - name: Reinstall runtime strictly from SHA-locked wheelhouse, without index
        run: python -m pip install --require-hashes --no-index --no-deps --force-reinstall --find-links "${{ runner.temp }}/lk-runtime-wheels" -r evidence/runtime_wheel_hashes.txt
      - name: Test Windows suspended Job and extraction regressions
        run: python -m unittest discover -s tests -v
      - name: G10 mixed-document two-worker Windows queue soak (engineering only)
        run: python benchmarks/g10_queue_soak.py --count 12 --output evidence/g10_windows_queue_soak.json
      - name: Build onedir offline candidate
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name LocalKnowledge --collect-all pypdfium2 --collect-all pdfplumber --collect-all pdfminer launcher.py
      - name: Verify frozen EXE and both private workers
        run: python packaging/windows_probe.py dist/LocalKnowledge/LocalKnowledge.exe evidence/windows_portable_probe.json
      - name: Stage bounded runtime license and NOTICE texts from locked wheelhouse (HOLD)
        run: python packaging/wheelhouse_stage.py notices "${{ runner.temp }}/lk-runtime-wheels" evidence/runtime_wheel_pins.txt dist/LocalKnowledge/THIRD_PARTY_NOTICES
      - name: Native manifest and license inventory (HOLD)
        run: python packaging/release_inventory.py dist/LocalKnowledge evidence/native_file_inventory.json
      - name: Audit wheel SHA, native byte matches and license notice paths
        run: python packaging/wheel_evidence.py audit "${{ runner.temp }}/lk-runtime-wheels" evidence/runtime_wheel_pins.txt evidence/native_file_inventory.json evidence/runtime_wheel_provenance.json
      - name: Fail closed if AGPL-only dev packages are bundled
        shell: pwsh
        run: |
          $paths = Get-ChildItem dist/LocalKnowledge -Recurse -File | Where-Object { $_.FullName -match '(?i)(PyMuPDF|fitz)' }
          if ($paths) { $paths | ForEach-Object { Write-Host $_.FullName }; throw 'Development-only dependency included in EXE' }
      - name: Upload engineering-only preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: G09-Windows-Engineering-HOLD
          path: |
            evidence/**
            dist/LocalKnowledge/**
          retention-days: 14
